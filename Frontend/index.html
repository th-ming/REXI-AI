        <h1>Rexi AI — Trợ lý AI đa mô hình</h1>
        <p>Rexi AI là trợ lý AI đa mô hình dùng trên web (tiếng Việt và tiếng Anh). Bạn có thể trò chuyện với nhiều mô hình như Gemini, GPT, Claude, DeepSeek, Groq và Ollama, cùng bộ công cụ sáng tạo và tiện ích trong một giao diện duy nhất.</p>
