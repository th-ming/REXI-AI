# Rexi AI — Render blueprint (web service duy nhất; backend tự serve Frontend/dist)
# TÁCH HOÀN TOÀN khỏi project/service PKTY — không dùng chung repo, DB, env.
#
# LƯU Ý (14/9/2026): service prod THẬT hiện tạo qua API/dashboard (KHÔNG phải qua
# blueprint này). render.yaml dưới đây đã được đối chiếu khớp 100% với service đã verify:
#   - region: oregon, plan: free, runtime: node (Node 24.x pin qua engines)
#   - buildCommand/startCommand đúng như Render serviceDetails
#   - KHÔNG cài binary phụ (python/yt-dlp/chromium): các tính năng tương ứng trả
#     501/status "not installed" có chủ đích (LOCAL-ONLY trên prod).
# Nếu mai sau switch sang Blueprint deploy thì giữ nguyên các giá trị này.
services:
  - type: web
    name: rexi-ai-backend
    runtime: node
    plan: free
    branch: main
    region: oregon
    healthCheckPath: /api/health
    rootDir: ""
    # QA 17/9: thêm `npx playwright install chromium` để render video (videoRenderer)
    # chạy được trên cloud — trước đây không cài browser nên tính năng video là local-only.
    buildCommand: "cd Backend && npm install --omit=dev && npx playwright install chromium && cd ../Frontend && npm install --include=dev && npm run build"
    startCommand: "cd Backend && node server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: postgresql
      # ── DB: Supabase (session pooler IPv4) — Render free PG internal/TLS lỗi không
      #    sửa được qua API. Chi tiết + cách xoay pass: docs/PROD-ENV.md
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: "5432"
      - key: PGDATABASE
        value: postgres
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGSSL
        value: "true"
      - key: SESSION_SECRET
        sync: false
      # BẮT BUỘC: auth.middleware THROW khi production không có JWT_SECRET
      - key: JWT_SECRET
        sync: false
      # ENC_KEY CỐ Ý KHÔNG SET: cryptoKeys fallback derive từ JWT_SECRET
      # (JWT_SECRET prod trùng local nên 12 key trong khoa_api giải mã chạy ngay).
      # Nếu sau này muốn tách key, thêm ENC_KEY và re-encrypt keys.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      # Agent nội bộ (ReAct qua chat API — không cần opencode.exe trên server)
      - key: AGENT_PROVIDER
        value: bai
      - key: AGENT_MODEL
        value: qwen3.8-flash
      # Hugging Face Token (MiniMax-H3, SD3, inference endpoints)
      # Tạo tại: https://huggingface.co/settings/tokens → New token (Read/Inference)
      - key: HF_TOKEN
        sync: false
