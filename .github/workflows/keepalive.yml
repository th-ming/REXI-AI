name: keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake REXI backend (health)
        run: curl -fsS -o /dev/null -m 30 -w "Health: HTTP %{http_code} in %{time_total}s\n" https://rexiai.bot.cd/api/health
      - name: Wake REXI backend (root)
        run: curl -fsS -o /dev/null -m 30 -w "Root: HTTP %{http_code} in %{time_total}s\n" https://rexiai.bot.cd/
